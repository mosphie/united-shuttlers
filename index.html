function setView(me){return`<div class="c"><h2>Settings &amp; app info</h2><p><b>United Shuttlers Sydney Badminton</b><br>Version ${VER} · Build ${BUILD}</p><button data-a="rl">Reload / check for update</button><p class="m">The web app updates automatically whenever it is reopened or reloaded.</p></div><div class="c"><h2>Appearance</h2><div class="r">${[['dark','🌙 Dark (space)'],['light','☀️ Light'],['auto','📱 Match phone']].map(x=>`<button class="${TH===x[0]?'on':''}" data-a="th" data-i="${x[0]}">${x[1]}</button>`).join('')}</div></div><div class="c"><h2>Requirements</h2><p class="m">iPhone/iPad: iOS 15 or newer (Safari). Android: version 8 or newer (Chrome). Needs an internet connection to load and browser storage turned on. Your club data is stored securely in the club's online database.</p><h3>Install on your phone</h3><p class="m"><b>iPhone:</b> open in Safari → Share → Add to Home Screen.<br><b>Android:</b> open in Chrome → ⋮ menu → Install app / Add to Home screen.</p></div><div class="c"><h2>Security status</h2>${MODE==='live'?`<p class="m">Signed in as <b>${esc(me.em||'')}</b> – role: <b>${me.role}</b>${me.ok?'':' (pending approval)'}.</p>`:''}<p class="m"><b>Sign-in codes:</b> ${sbOn()?'real email codes':'not connected'}. ${MODE==='live'?'Members, sign-in, sessions, RSVPs, payments, chat and notifications are stored in the shared club database. Only people with the right permission can see each item.':'Demo data is stored on this device only.'}</p>${NODEMO?'':'<p class="m">Demo mode: sign-in codes appear on screen and all data stays in this browser. Before real members use the app it needs a secure backend (database, real email/SMS codes and server-side permissions). See the build guide.</p>'}</div>${me.role==='admin'?`<div class="c"><h2>Admin maintenance</h2><button data-a="bk">Backup / restore data</button></div>`:''}<div class="c"><h2>What is new</h2>${CHG.map(x=>`<p class="m">${esc(x)}</p>`).join('')}</div>`}
function about(){return`<button data-a="go" data-i="sessions">← Back</button><div class="c">${logo(190)}<h2>About United Shuttlers Sydney Badminton</h2><p>United Shuttlers Sydney Badminton is a badminton club app for Sydney players. Members can RSVP to sessions, pay session fees, chat, connect with other members and keep track of their payments.</p><h3>Session rules</h3><p>Repeating sessions open for RSVP up to 3 sessions in advance; the next one opens as sessions finish or are cancelled. Members can cancel an RSVP free of charge until 24 hours before the session starts. After that, please contact the organiser. When a session is full, players join a waitlist and move up automatically. New members join straight after confirming their email.</p></div><div class="c"><h2>Privacy Policy</h2><p class="m">Last updated 24 November 2026</p><h3>What we collect</h3><p>Name, username, mobile number and email; profile details (photo, level, play style, bio); RSVPs and guest numbers; payment records and uploaded receipts (including amount and notes); club credit balance; chat messages and friend connections.</p><h3>How we use it</h3><p>To verify your email or mobile number with a one-time code, and to run the club: approve members, manage sessions and attendance, record and approve payments, and let members communicate. Members receive in-app notifications about new sessions, session changes, payments and messages. We do not sell your information or use it for advertising.</p><h3>Who can see it</h3><p>Admins can see all member details, payments, receipts and profiles. Organisers see RSVPs and payments for their own sessions. Other members see your name, and your photo and play details only if your profile is public. Reports about members are seen only by admins. Main chat is visible to all members; session chats to attendees and organisers; private messages only to the two people involved.</p><h3>Where it is stored</h3><p>The app stores club data (members, sessions, RSVPs, payments, receipts, messages and notifications) in the club's secure online database (Supabase). It is protected by sign-in and access rules, so members only see what they are allowed to see. A copy of some data is also kept on your device so the app loads quickly. When email verification is switched on, your email address is sent to our sign-in provider (Supabase) and an email-sending service so they can deliver your code. A future shared version will store data with a hosting provider, and this policy will be updated before then. Payments are recorded only; card payments are not processed in this app.</p><p>Club admins can view members' details, payment records and private messages when needed to run the club safely. Members can only see their own payments and the conversations they are part of.</p><h3>Your choices</h3><p>You can edit your profile, set it to private, delete your own chat messages and remove friends. To correct or delete your account or data, or to ask what we hold about you, contact the organisers. The club handles personal information in line with the Australian Privacy Principles.</p><h3>Security and retention</h3><p>We keep payment records as long as needed for club accounting. Receipts may contain bank details, so only upload what is needed and avoid sharing sensitive information in chats.</p><h3>Contact</h3><p>${CLUB.email}</p><p class="m">This policy is a general template, not legal advice. Please have it reviewed before launch.</p></div>`}
